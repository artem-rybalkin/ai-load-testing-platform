# Dev overlay: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# shared-watcher запускає tsc --watch для packages/shared.
# Коли shared/src змінюється → dist/ перебудовується → tsx watch у сервісах
# підхоплює зміну через symlink node_modules/@alt/shared і перезапускається.

services:
  shared-watcher:
    build:
      context: .
      dockerfile: packages/shared/Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/packages/shared/node_modules
    working_dir: /app


  api-service:
    build:
      context: .
      dockerfile: services/api-service/Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/services/api-service/node_modules
    command: npx tsx watch src/index.ts

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/services/ai-service/node_modules
    command: npx tsx watch src/index.ts

  results-service:
    build:
      context: .
      dockerfile: services/results-service/Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/services/results-service/node_modules
    command: npx tsx watch src/index.ts

  worker-backend:
    build:
      context: .
      dockerfile: services/worker-backend/Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/services/worker-backend/node_modules
    environment:
      WORKER_CONCURRENCY: 3   # allow 3 concurrent k6 tests during E2E runs
    command: npx tsx watch src/index.ts

  worker-client:
    build:
      context: .
      dockerfile: services/worker-client/Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/services/worker-client/node_modules
    command: npx tsx watch src/index.ts

  analyser-service:
    build:
      context: .
      dockerfile: services/analyser-service/Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/services/analyser-service/node_modules
    command: npx tsx watch src/index.ts

  recorder-service:
    build:
      context: .
      dockerfile: services/recorder-service/Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/services/recorder-service/node_modules
    # No command override — uses CMD from Dockerfile.dev (/docker-entrypoint-dev.sh)
    # which starts Xvfb + x11vnc + noVNC before launching tsx watch

  ui:
    build:
      context: .
      dockerfile: services/ui/Dockerfile.dev
    restart: on-failure
    volumes:
      - ./services/ui:/app/services/ui
      - ui_node_modules:/app/services/ui/node_modules
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
      VITE_RESULTS_URL: http://localhost:3004
      VITE_RECORDER_URL: http://localhost:3007
      RECORDER_SERVICE_URL: http://recorder-service:3007
      VITE_API_KEY: ${API_KEY:-}
    # 8s delay lets the WSL2 bind mount warm up before Vite scans files.
    # restart: on-failure means Docker auto-recovers if Vite still crashes.
    command: sh -c "sleep 8 && npm run dev"

volumes:
  ui_node_modules:
