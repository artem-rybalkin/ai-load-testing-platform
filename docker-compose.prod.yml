# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes vs base:
#   - Caddy handles all public traffic on 80/443 with automatic HTTPS (Let's Encrypt)
#   - No internal ports exposed (postgres, redis, rabbitmq, workers inaccessible from internet)
#   - UI/api/results-service ports removed — traffic flows through Caddy only
#   - Resource limits on all services
#   - Uses DOMAIN, ALLOWED_ORIGIN, API_KEYS from environment
#
# Required env vars:
#   DOMAIN           e.g. example.com  (also needs api.example.com + data.example.com DNS)
#   API_KEYS         comma-separated API keys
#   API_KEY          single key for UI
#   ALLOWED_ORIGIN   https://example.com
#   ANTHROPIC_API_KEY

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - ui
      - api-service
      - results-service
  postgres:
    ports: !reset []          # never expose DB to the internet

  redis:
    ports: !reset []          # never expose Redis to the internet

  rabbitmq:
    ports: !reset []          # never expose RabbitMQ to the internet

  worker-backend:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  worker-client:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  ai-service:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  results-service:
    ports: !reset []    # Caddy proxies data.${DOMAIN} → results-service:3004
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    environment:
      API_KEYS: ${API_KEYS}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}

  api-service:
    ports: !reset []    # Caddy proxies api.${DOMAIN} → api-service:3000
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    environment:
      API_KEYS: ${API_KEYS}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}

  ui:
    ports: !reset []    # Caddy proxies ${DOMAIN} → ui:3006
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    environment:
      NEXT_PUBLIC_API_KEY: ${API_KEY}
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
      NEXT_PUBLIC_RESULTS_URL: https://data.${DOMAIN}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}

volumes:
  caddy_data:    # TLS certificates — persists across restarts
  caddy_config:
