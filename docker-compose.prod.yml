# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Changes vs base:
#   - Removes internal port bindings (postgres, redis, rabbitmq not exposed)
#   - Removes worker/ai/internal service ports
#   - Adds resource limits
#   - Uses ALLOWED_ORIGIN and API_KEYS from environment

services:
  postgres:
    ports: !reset []          # never expose DB to the internet

  redis:
    ports: !reset []          # never expose Redis to the internet

  rabbitmq:
    ports: !reset []          # never expose RabbitMQ to the internet

  worker-backend:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  worker-client:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  ai-service:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  results-service:
    ports:
      - "3004:3004"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    environment:
      API_KEYS: ${API_KEYS}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}

  api-service:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    environment:
      API_KEYS: ${API_KEYS}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}

  ui:
    environment:
      NEXT_PUBLIC_API_KEY: ${API_KEY}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
