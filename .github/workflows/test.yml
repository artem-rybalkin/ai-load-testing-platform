name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/testdb
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      API_KEYS: test-key-1,test-key-2
      ALLOWED_ORIGIN: "*"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      rabbitmq:
        image: rabbitmq:3-management-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 60s
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: |
          npm run build:shared
          npm run build:tracing
          npx tsc --noEmit -p services/api-service/tsconfig.typecheck.json
          npx tsc --noEmit -p services/results-service/tsconfig.typecheck.json
          npx tsc --noEmit -p services/worker-backend/tsconfig.json
          npx tsc --noEmit -p services/ai-service/tsconfig.json

      - name: Unit + Integration tests
        run: npm test -- --coverage --reporter=verbose
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy-key-for-tests' }}

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    needs: test
    # Previously only ran on pushes to main (github.ref == 'refs/heads/main'),
    # which is never true for a pull_request event — so PRs merged into main
    # with zero e2e validation. Now also runs on every PR targeting main.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start services
        run: |
          cp .env.example .env 2>/dev/null || echo "GEMINI_API_KEY=dummy" > .env
          docker compose up -d
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy-key-for-tests' }}

      - name: Wait for services to be healthy
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:3000/health; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:3004/health; do sleep 2; done'
          echo "All services healthy"

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3006

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down -v
