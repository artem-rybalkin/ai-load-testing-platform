
# ── OpenTelemetry — reuse across all services via YAML anchor ────────────────
x-otel: &otel
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  # host.docker.internal reaches host machine from inside Docker (where Tempo runs)
  # Override: OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318 if Tempo is in this compose
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}

services:
  # ── Infrastructure ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alt_user
      POSTGRES_PASSWORD: alt_password
      POSTGRES_DB: alt_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alt_user -d alt_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 15s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: alt_user
      RABBITMQ_DEFAULT_PASS: alt_password
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 60s

  api-service:
    build:
      context: .
      dockerfile: services/api-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: api-service
      PORT: 3000
      RABBITMQ_URL: amqp://alt_user:alt_password@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://alt_user:alt_password@postgres:5432/alt_db
      RESULTS_URL: http://results-service:3004
      API_KEYS: ${API_KEYS:-}          # comma-separated keys; empty = auth disabled (dev only)
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}  # shared secret for service-to-service callbacks; empty = disabled (dev only)
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
      SESSION_SECRET: ${SESSION_SECRET:-dev-local-secret-change-for-production}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker-backend:
    build:
      context: .
      dockerfile: services/worker-backend/Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: worker-backend
      PORT: 3002
      RABBITMQ_URL: amqp://alt_user:alt_password@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://alt_user:alt_password@postgres:5432/alt_db
      RESULTS_URL: http://results-service:3004
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}  # shared secret for service-to-service callbacks; empty = disabled (dev only)
      WORKER_CONCURRENCY: 1          # increase for parallel k6 runs per replica
      K6_MAX_DURATION_MS: 600000     # 10 minutes hard timeout
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: ai-service
      PORT: 3001
      RABBITMQ_URL: amqp://alt_user:alt_password@rabbitmq:5672
      RESULTS_URL: http://results-service:3004
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}  # shared secret for service-to-service callbacks; empty = disabled (dev only)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      WORKER_CONCURRENCY: 3          # AI calls are I/O-bound, parallelise
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker-client:
    build:
      context: .
      dockerfile: services/worker-client/Dockerfile
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: worker-client
      PORT: 3003
      RABBITMQ_URL: amqp://alt_user:alt_password@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}  # shared secret for service-to-service callbacks; empty = disabled (dev only)
      WORKER_CONCURRENCY: 2          # Puppeteer is I/O-bound, safe to run 2 per replica
      PUPPETEER_MAX_DURATION_MS: 300000  # 5 minutes
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  results-service:
    build:
      context: .
      dockerfile: services/results-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3004:3004"   # REST API + WebSocket (/ws on same port)
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: results-service
      PORT: 3004
      DATABASE_URL: postgresql://alt_user:alt_password@postgres:5432/alt_db
      READ_DATABASE_URL: ${READ_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://alt_user:alt_password@rabbitmq:5672
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STALE_RUNNING_MINUTES: 15      # mark running tests failed after 15 min
      STALE_PENDING_MINUTES: 30      # mark pending tests failed after 30 min
      API_KEYS: ${API_KEYS:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}  # shared secret for service-to-service callbacks; empty = disabled (dev only)
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
      SESSION_SECRET: ${SESSION_SECRET:-dev-local-secret-change-for-production}
      RECORDER_URL: http://recorder-service:3007
      ANALYSER_URL: http://analyser-service:3008
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  analyser-service:
    build:
      context: .
      dockerfile: services/analyser-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: analyser-service
      PORT: 3008
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      RESULTS_URL: http://results-service:3004
    # No hard dependencies — degrades gracefully if unreachable

  recorder-service:
    build:
      context: .
      dockerfile: services/recorder-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3007:3007"   # REST + WebSocket API
      - "6080:6080"   # noVNC browser viewer (open in browser to see the recording window)
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: recorder-service
      PORT: 3007
      LOG_LEVEL: debug
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      CHROMIUM_PATH: /usr/bin/chromium-browser
      NOVNC_URL: http://localhost:6080/vnc.html?autoconnect=true
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
    # No hard dependencies — recorder is optional; platform works without it

  ui:
    build:
      context: .
      dockerfile: services/ui/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_RESULTS_URL: http://localhost:3004
        VITE_RECORDER_URL: http://localhost:3007
        VITE_API_KEY: ${API_KEY:-}
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_RESULTS_URL: http://localhost:3004
      VITE_RECORDER_URL: http://localhost:3007
      VITE_API_KEY: ${API_KEY:-}
      API_SERVICE_URL: http://api-service:3000
      RESULTS_SERVICE_URL: http://results-service:3004
      RECORDER_SERVICE_URL: http://recorder-service:3007
    depends_on:
      - api-service
      - results-service

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
